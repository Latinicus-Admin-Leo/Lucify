<!doctype html>
<html lang="hr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#0a0a0b" />
    <!-- Lucify je taman i u tamnoj i u svijetloj postavci sustava, pa se
         boja trake preglednika ne mijenja s njom. -->
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/svg+xml" href="/lucify.svg" />
    <!-- Prečac na početnom zaslonu. Popis ikona i boja stoji u
         `manifest.webmanifest`, koji slaže `vite.config.js`, ali iOS iz njega
         ne uzima ni ikonu ni to da se otvara bez trake preglednika, nego traži
         ova tri retka. Bez prvoga bi prečac nosio snimku zaslona. -->
    <link rel="apple-touch-icon" href="/lucify-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Lucify" />
    <!-- `black-translucent`: stranica ide pod satom i baterijom, a razmak pod
         njima drži `viewport-fit=cover` gore i `safe-area-inset` u CSS-u. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Ovdje je prije stajalo pismo s Googleovih poslužitelja. Sada stoji u
         `public/pisma/`, a `@font-face` mu je na vrhu `glazba.css`: Lucify
         izvana ne traži ništa, pa jednako izgleda i bez mreže. -->
    <title>Lucify</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
